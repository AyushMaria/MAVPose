site_name: MAVPose
site_description: Clean, unit-correct telemetry from ArduPilot and PX4 flight logs
site_url: https://ayushmaria.github.io/MAVPose/
repo_url: https://github.com/AyushMaria/MAVPose
repo_name: AyushMaria/MAVPose

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]

nav:
  - Home: index.md
  - Guide:
    - Concepts: guide/concepts.md
    - Log formats: guide/formats.md
    - Plot assistant: guide/chat.md
  - API reference:
    - load and FlightLog: api/flightlog.md
    - LogExtractor: api/log_extractor.md
    - File validation: api/file_validator.md
    - Plot assistant: api/chat.md
    - API stability: api-stability.md
  - Changelog: changelog.md
