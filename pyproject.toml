[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mavpose"
version = "0.2.0"
description = "Clean, unit-correct telemetry from drone flight logs (MAVLink .tlog, ArduPilot .bin, PX4 .ulg), with an optional plain-English plot assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Core data layer only. The chat assistant is the optional [chat] extra.
dependencies = [
    "pymavlink>=2.4.37",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyulog>=1.1.0",
]

[project.optional-dependencies]
chat = [
    "matplotlib>=3.8",
    "openai>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9", "mkdocstrings[python]>=0.25"]
dev = ["mavpose[chat]", "pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
mavpose = "mavpose.chat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mavpose"]
