[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mavpose"
version = "0.2.1"
description = "Clean, unit-correct telemetry from drone flight logs (MAVLink .tlog, ArduPilot .bin, PX4 .ulg), with an optional plain-English plot assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "drone", "uav", "flight-log", "telemetry", "ardupilot", "px4", "mavlink",
    "dataflash", "ulog", "tlog", "pymavlink", "pandas", "parquet", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Core data layer only. The chat assistant is the optional [chat] extra.
dependencies = [
    "pymavlink>=2.4.48",  # 2.4.42+: DataFlash FMTU units; 2.4.48+: resync after corrupt .tlog data
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyulog>=1.1.0",
]

[project.optional-dependencies]
chat = [
    "matplotlib>=3.8",
    "openai>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
]
mcp = ["mcp>=2.3,<3"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9", "mkdocstrings[python]>=0.25"]
dev = ["mavpose[chat,mcp]", "pytest>=7", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://ayushmaria.github.io/MAVPose/"
Documentation = "https://ayushmaria.github.io/MAVPose/api-reference.html"
Source = "https://github.com/AyushMaria/MAVPose"
Issues = "https://github.com/AyushMaria/MAVPose/issues"
Changelog = "https://github.com/AyushMaria/MAVPose/blob/master/CHANGELOG.md"

[project.scripts]
mavpose = "mavpose.chat.cli:main"
mavpose-mcp = "mavpose.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["mavpose"]

[tool.ruff.lint]
# Same rules CI uses, so a plain `ruff check` matches CI.
select = ["E", "F", "W", "B"]
ignore = ["E501"]
